# ==============================================================================
# Deploy (caller)
# ==============================================================================
# The thin caller that makes HoneyDrunk.Infrastructure deployable. It resolves a
# template / parameter-file / resource-group triple from the dispatch inputs and
# hands off to the Actions reusable workflow job-deploy-bicep.yml@main, which
# runs the bicep build + lint + what-if preflight and the `az deployment` apply.
#
# CADENCE (ADR-0077 D4, amended 2026-06-02): infra deploys run on this repo's OWN
# cadence — MANUAL workflow_dispatch — decoupled from application release tags.
# The shared foundation changes rarely and is promoted deliberately, not on every
# app build.
#
# APPROVAL GATE (ADR-0033): a dedicated `gate` job declares `environment: <env>`
# (the `environment:` key is only valid on a `steps:` job, not on a `uses:`
# reusable-workflow caller). The `deploy` job `needs: gate`, so the chosen
# GitHub Environment's protection rules apply — prod requires reviewers before
# the apply proceeds.
#
# CREDENTIALS: OIDC federation. azure-client-id / -tenant-id / -subscription-id
# come from repo/org **vars** (AZURE_CLIENT_ID / AZURE_TENANT_ID /
# AZURE_SUBSCRIPTION_ID) the operator configures — never secrets. The deploy
# identity provisions resources; it does NOT read secret values (D7 / invariant 8).
# ==============================================================================

name: Deploy

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Target environment.'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      target:
        description: 'What to deploy: platform, isolated shared SQL server, or a single Node.'
        required: true
        type: choice
        options:
          - platform
          - platform-sql
          - platform-app-network
          - node
      node:
        description: 'Node short name (required when target=node, e.g. notify). Ignored for target=platform.'
        required: false
        type: string
      mode:
        description: 'plan = what-if dry run only (review, nothing applied). apply = actually deploy. Defaults to plan.'
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
      bootstrap:
        description: 'Bootstrap pass for a BRAND-NEW system-MI Node (target=node only). Runs a public placeholder image with no registry/secret wiring so the first revision is healthy before its AcrPull/Key Vault RBAC exists, while still creating the role assignments. Use only for a new app, then initialize explicitly with manage-app and reviewed inputs. Ignored for target=platform. See nodes/<node>/README.md.'
        required: false
        type: boolean
        default: false

      manage-app:
        description: 'Pulse initialization/maintenance ONLY. Requires app-image and traffic-revision; default leaves CD-owned app configuration untouched. Quiesce CD and review the maintenance procedure first.'
        required: false
        type: boolean
        default: false
      app-image:
        description: 'Approved image for explicit Pulse initialization/maintenance. Required only with manage-app.'
        required: false
        type: string
      traffic-revision:
        description: 'Full verified known-good Pulse revision to KEEP at 100 percent during maintenance. Required only with manage-app. Never latest.'
        required: false
        type: string

      identity-parameters:
        description: 'Identity dev only: reviewed nonsecret JSON containing provisionDatabase, provisionVault, provisionLifecycleQueues or appUpdate. No server/admin/firewall fields. See nodes/identity/README.md.'
        required: false
        type: string

      sql-parameters:
        description: 'platform-sql dev only: reviewed nonsecret JSON containing serverSetup with the approved Entra administrator group and explicit firewall list. Empty performs no writes. See platform/sql/README.md.'
        required: false
        type: string

      network-parameters:
        description: 'platform-app-network dev only: reviewed networkSetup addressPrefix/subnetPrefix JSON. Empty writes nothing; CIDR overlap and live approval required.'
        required: false
        type: string

# Superset of the called workflow's needs (invariant 39):
#   id-token: write  (OIDC federation)   contents: read  (checkout)
permissions:
  id-token: write
  contents: read

jobs:
  resolve:
    name: Resolve deploy target
    runs-on: ubuntu-latest
    outputs:
      template-path: ${{ steps.compute.outputs.template-path }}
      parameters-path: ${{ steps.compute.outputs.parameters-path }}
      resource-group: ${{ steps.compute.outputs.resource-group }}
      additional-parameters: ${{ steps.compute.outputs.additional-parameters }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Compute template / params / resource group
        id: compute
        shell: bash
        env:
          ENV: ${{ inputs.env }}
          TARGET: ${{ inputs.target }}
          NODE: ${{ inputs.node }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
          MANAGE_APP: ${{ inputs.manage-app }}
          APP_IMAGE: ${{ inputs.app-image }}
          TRAFFIC_REVISION: ${{ inputs.traffic-revision }}
          IDENTITY_PARAMETERS: ${{ inputs.identity-parameters }}
          SQL_PARAMETERS: ${{ inputs.sql-parameters }}
          NETWORK_PARAMETERS: ${{ inputs.network-parameters }}
        run: python3 scripts/resolve-deploy-target.py

  gate:
    name: Approval gate (${{ inputs.env }})
    needs: resolve
    runs-on: ubuntu-latest
    # ADR-0033 approval gate. `environment:` is only valid on a `steps:` job,
    # NOT on a `uses:` reusable-workflow caller job — so the gate lives here.
    # The deploy job `needs: gate`, so it runs only after this environment's
    # required reviewers approve (prod/staging gated; dev typically open).
    environment: ${{ inputs.env }}
    steps:
      - run: echo "Approved deploy of ${{ inputs.target }} to ${{ inputs.env }}."

  deploy:
    name: Deploy (${{ inputs.target }} / ${{ inputs.env }})
    needs: [resolve, gate]
    permissions:
      id-token: write
      contents: read
    uses: HoneyDrunkStudios/HoneyDrunk.Actions/.github/workflows/job-deploy-bicep.yml@main
    with:
      env: ${{ inputs.env }}
      bicep-version: v0.48.1
      template-path: ${{ needs.resolve.outputs.template-path }}
      parameters-path: ${{ needs.resolve.outputs.parameters-path }}
      deployment-scope: resourceGroup
      resource-group: ${{ needs.resolve.outputs.resource-group }}
      what-if-only: ${{ inputs.mode == 'plan' }}
      # Resolver rejects conflicting/missing inputs before authentication.
      additional-parameters: ${{ needs.resolve.outputs.additional-parameters }}
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
