name: PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform
    uses: HoneyDrunkStudios/HoneyDrunk.Actions/.github/workflows/job-terraform-validate.yml@6ce7858a229f4986cc2f68cb8864642071fe234a
    with:
      actions-ref: 6ce7858a229f4986cc2f68cb8864642071fe234a

  secret-scan:
    name: Secret Scan
    uses: HoneyDrunkStudios/HoneyDrunk.Actions/.github/workflows/job-secret-scan.yml@6ce7858a229f4986cc2f68cb8864642071fe234a
    with:
      scan-mode: diff-only

  required-iac-gate:
    # Compatibility context required by the existing require-bicep-lint ruleset.
    # It now certifies the complete Terraform/ownership suite and secret scan.
    # Rename only together with a separately approved ruleset migration.
    name: Bicep Lint / Bicep Lint
    needs: [terraform, secret-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all replacement IaC checks
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          import json
          import os
          results = json.loads(os.environ['RESULTS'])
          assert set(results) == {'terraform', 'secret-scan'}, 'Missing validation job'
          assert all(item['result'] == 'success' for item in results.values()), 'IaC validation failed, cancelled or skipped'
          print('Terraform format/schema/mocked tests, ownership contracts and secret scan passed.')
